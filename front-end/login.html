<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Doe-se</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-card login">
        <h1>Entrar no Doe-se</h1>
        <form id="login">
            <label for="email">E-mail</label>
            <input class="input" id="email" type="email" placeholder="Digite seu e-mail" required>
            <label for="senha">Senha</label>
            <input class="input" id="senha" type="password" placeholder="Digite sua senha" required>
            <button type="submit" class="btn-login btn">Entrar</button>
            <div id="msg"></div>
        </form>
        <div class="auth-actions">
            <p>Não possui cadastro? <a href="cadastrar.html">Criar conta</a></p>
            <p style="margin-top:8px"><a href="index.html">← Voltar para os itens</a></p>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        document.getElementById('login').onsubmit = async e => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            try {
                const d = await api('/usuarios/login', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        senha: document.getElementById('senha').value
                    })
                });
                localStorage.setItem('token', d.token);
                localStorage.setItem('usuario', JSON.stringify(d.usuario));
                alert('Login realizado com sucesso!');
                location.href = 'index.html';
            } catch (x) {
                msg.textContent = x.message;
                msg.className = 'msg error';
            }
        };
    </script>
</body>
</html>
